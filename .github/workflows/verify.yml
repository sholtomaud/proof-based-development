name: Proof-Based Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tier 0, 1, 2 & 3: Fail fast on cryptographic proof-lock tamper detection,
  # types, lint, escape hatches, boundaries, unit tests, and property proofs.
  static-and-properties:
    name: Integrity Seal, Static, Boundaries & Property Proofs
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js v26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify package signatures
        run: npm audit signatures

      - name: Cryptographic Proof Lock & Changelog Chain Check
        run: npm run proof:check

      # Out-of-band PR tamper gate: compares the PR working tree against the
      # trusted base branch's proof-lock.json so an agent cannot forge or
      # regenerate proof-lock.json to hide test or harness edits.
      - name: PR Base-Branch Tamper Gate (vs origin/${{ github.base_ref }})
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          FLAGS=""
          if node -e "const labels = JSON.parse(process.env.PR_LABELS || '[]'); process.exit(labels.includes('allow-test-change') ? 0 : 1)"; then
            FLAGS="$FLAGS --allow-test-change"
          fi
          if node -e "const labels = JSON.parse(process.env.PR_LABELS || '[]'); process.exit(labels.includes('allow-harness-change') ? 0 : 1)"; then
            FLAGS="$FLAGS --allow-harness-change"
          fi
          node scripts/proof-lock.ts --verify-pr-base "origin/$BASE_REF" $FLAGS

      - name: Typecheck
        run: npm run typecheck

      - name: Lint & Zero Escape Hatches
        run: npm run lint

      - name: Architectural Boundary Check
        run: npm run arch:check

      - name: Unit Tests
        run: npm run test:unit

      - name: Property-Based Invariant Proofs
        run: npm run test:properties

  get-playwright-version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Playwright version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Tier 4: Headless browser proofs (dev, production, Firefox, WebKit, subpath),
  # proof report generation, metric-floor ratchet check, artifact upload, and Pages bundle.
  e2e-proofs:
    name: Runtime & Visual Proofs (Playwright)
    needs: [static-and-properties, get-playwright-version]
    runs-on: ubuntu-26.04
    container: mcr.microsoft.com/playwright:v${{ needs.get-playwright-version.outputs.version }}-noble
    env:
      # Firefox will not start unless $HOME belongs to the user running it.
      HOME: /root
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js v26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright E2E Proofs
        run: npm run test:e2e

      - name: Generate Proof Report & Bundle Media
        if: always()
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          node scripts/generate-proof-report.ts \
            --out public/data/proof-report.json \
            --playwright-json test-results/playwright-results.json \
            --bundle-media-dir public/proof-media \
            --playwright-report-url playwright-report/index.html \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --pages-url "$PAGES_URL"

      - name: Verify Monotonic Metric Floors & Skip Ceiling
        run: node scripts/proof-lock.ts --verify-metrics public/data/proof-report.json

      - name: Upload Playwright Proof Artifacts (Videos, Traces, HTML Report)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-proof-artifacts
          path: |
            playwright-report/
            test-results/
            public/data/proof-report.json
          retention-days: 14

      - name: Build Boba Proof Report Site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run build -- --base "/${{ github.event.repository.name }}/"
          cp dist/index.html dist/404.html
          cp -r playwright-report dist/playwright-report

      - name: Upload GitHub Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy-pages:
    name: Deploy Proof Dashboard to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e-proofs]
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
